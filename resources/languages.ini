# Prefs Language combo (curated). Embedded via GResource.
#
# One group per code (section name = prefs value / settings.ini language=).
# Combo order = group order in this file (no separate codes= list).
# No "auto" / detect — user picks an explicit language.
#
# stream=  → OnlineStream.set_option("language", ...); empty = English-only pack (ignored).
# tier=    → ready | broad (NVIDIA card tiers).
# family=  → which model family in models.ini serves this language.
# display= → optional ICU locale tag if different from section name (e.g. zh-Hans-CN).
# label=   → optional endonym override when ICU’s tag undersells spoken variety
#            (e.g. 普通话); gloss still comes from display=/section via ICU.
#
# Chinese: NVIDIA card has zh-CN (broad) only — Mainland Mandarin / Simplified.
# Spoken (cmn) ≠ written (Hans/Hant); no Traditional / Cantonese pack yet.

[en]
stream=
tier=ready
family=nemotron-en

[en-US]
stream=
tier=ready
family=nemotron-en

[en-GB]
stream=
tier=ready
family=nemotron-en

